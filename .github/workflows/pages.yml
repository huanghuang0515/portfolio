# 推上 main 就自動發佈到 GitHub Pages。
# configure-pages 的 enablement: true 會在 Pages 尚未啟用時自動開啟，
# 因此不需要先到 Settings → Pages 手動設定。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # 只上傳網站本身，開發輔助檔（serve.js、start.bat 等）不發佈
      - name: Prepare site
        run: |
          mkdir -p _site
          cp -r index.html assets .nojekyll _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
