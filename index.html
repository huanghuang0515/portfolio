<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yi Hua Huang｜UI/UX Designer Portfolio</title>
<meta name="description" content="Yi Hua Huang — I'm a creative UI/UX designer based in Taiwan.">
<meta name="theme-color" content="#ffffff">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 設計稿字型為 NanumGothic；以非阻塞方式載入，字型未到前先用備用字繪製，不白屏。 -->
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&display=swap"
      media="print" onload="this.media='all'">
<noscript>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&display=swap">
</noscript>
<link rel="stylesheet" href="assets/css/portfolio.css">

<script>
/* 在首次繪製前決定是否播放開場動畫，避免「完整畫面先閃一下再重播」。
   不依賴 portfolio.js，故 JS 失敗時畫面仍為完成態。 */
(function () {
  var d = document.documentElement;
  d.classList.add('js');
  try {
    var q = location.search + location.hash;
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var forced = /[?&#]replay\b/.test(q);           /* 明確要求播放，覆寫 reduce-motion */
    if (!reduce || forced) d.classList.add('anim'); /* anim = 元素起跑於隱藏態，等 is-playing 才進場 */
    /* 保險：portfolio.js 若載入失敗，7s 後強制解除隱藏態，畫面不得永遠空白 */
    window.__pfSafety = setTimeout(function () {
      if (!d.classList.contains('is-playing')) d.classList.remove('anim');
    }, 7000);
  } catch (err) { /* 任何例外都退回完成態 */ }
})();
</script>
</head>

<body>

<!-- ===========================================================================
     stage = Figma frame「Desktop - 1」(1:2, 1440 × 886)
     子層順序與設計稿的 z-order 完全一致：
       z0 Frame 1 / Group 97   米色條紋（畫面下半）
       z1 Group 98             近白條紋（畫面上半）
       z2 Group 100            海面：藍色波浪色塊 + 白色條紋（以波浪形狀遮罩）
       z3 Frame 2              header
       z4 Ellipse 2            太陽
       z5–z8 Vector ×4         海鷗
       z9–z11 Typing ×3        三行文字
     =========================================================================== -->
<div class="stage" id="top">

  <div class="stripes stripes--a" data-node-id="1:408" aria-hidden="true"></div>
  <div class="stripes stripes--b" data-node-id="1:982" aria-hidden="true"></div>

  <div class="sea" data-node-id="3:13617" aria-hidden="true">
    <img class="sea__shape" src="assets/img/sea.svg" alt="" data-node-id="1:3">
    <div class="stripes stripes--c" data-node-id="1:695"></div>
    <!-- 白色條紋的裁切範圍：與 sea.svg 同一條波浪曲線，座標換算成 0–1
         （x/1440、y/300）。用同文件內的 clipPath 而非 mask: url(...)，
         file:// 下外部 SVG 遮罩會被當成跨來源而失效。 -->
    <svg class="sprite" width="0" height="0" aria-hidden="true" focusable="false">
      <defs>
        <clipPath id="waveClip" clipPathUnits="objectBoundingBox">
          <path d="M-0.061111 0.998333C0.000463 0.8651 0.178681 0.62272 0.398958 0.719073C0.674306 0.839517 0.706944 1.076143 1.060417 0.925853V0H-0.061111V0.998333Z"/>
        </clipPath>
      </defs>
    </svg>
  </div>

  <!-- Header（Figma: Frame 2 / 1:1269） -->
  <header class="site-header" data-node-id="1:1269">
    <a class="logo" href="#top" data-node-id="3:13648" aria-label="Portfolio — 回到首頁">
      <img class="logo__arc logo__arc--top"    src="assets/img/logo-arc-top.svg"    alt="" width="203" height="30" data-node-id="3:13645">
      <img class="logo__arc logo__arc--bottom" src="assets/img/logo-arc-bottom.svg" alt="" width="203" height="30" data-node-id="3:13647">
      <span class="logo__text" data-node-id="3:13620">Portfolio</span>
    </a>

    <nav class="nav" aria-label="主導覽">
      <a class="nav__link" href="#" data-node-id="3:13649">About</a>
      <a class="nav__link" href="#" data-node-id="3:13650">Project</a>
      <a class="nav__link" href="#" data-node-id="3:13651">Resume</a>
    </nav>
  </header>

  <main class="banner" aria-label="首頁主視覺">
    <img class="sun" src="assets/img/sun.svg" alt="" width="90" height="90" data-node-id="1:61" aria-hidden="true">

    <img class="bird bird--1" src="assets/img/bird-1.svg" width="149" height="57" alt="" data-node-id="3:13597" aria-hidden="true">
    <img class="bird bird--2" src="assets/img/bird-2.svg" width="132" height="35" alt="" data-node-id="3:13604" aria-hidden="true">
    <img class="bird bird--3" src="assets/img/bird-3.svg" width="150" height="76" alt="" data-node-id="3:13610" aria-hidden="true">
    <img class="bird bird--4" src="assets/img/bird-4.svg" width="116" height="82" alt="" data-node-id="3:13601" aria-hidden="true">

    <h1 class="type type--name" data-node-id="5:1201"><span class="type__text">Yi Hua Huang</span></h1>
    <p  class="type type--role" data-node-id="5:1217"><span class="type__text">UI/UX Designer</span></p>
    <p  class="type type--tagline" data-node-id="5:1235"><span class="type__text">I&rsquo;m a creative UI/UX designer based in Taiwan.</span></p>
  </main>
</div>

<!-- 重播開場動畫；設計稿的 timeline 為無限循環，此處預設播放一次（?loop 可還原循環）。 -->
<button class="replay" type="button" id="replay" title="重播開場動畫（5.8s）">
  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    <path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/>
  </svg>
  <span>Replay</span>
</button>

<script src="assets/js/portfolio.js"></script>
</body>
</html>
